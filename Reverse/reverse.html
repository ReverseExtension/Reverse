<!DOCTYPE html>
<html lang="en" class="theme-dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>REVERSE</title>
  <link rel="stylesheet" href="reverse.css" />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    referrerpolicy="no-referrer"
  />
</head>

<body>
  <div class="app-container">
    <header class="app-header">
      <div class="logo-container">
        <i class="fas fa-undo-alt logo-icon"></i>
        <h1 data-i18n="app_title">REVERSE</h1>
      </div>
      <div class="header-controls">
        <button id="themeToggle" class="icon-btn" data-i18n-title="toggle_theme" title="Toggle Theme">
          <i class="fas fa-sun"></i>
        </button>
        <button id="settingsBtn" class="icon-btn" data-i18n-title="settings" title="Settings">
          <i class="fas fa-cog"></i>
        </button>
      </div>
    </header>

    <main class="app-main">
      <div class="recorder-panel" id="recorderPanel">
        <div class="recorder-collapsible-content">
          <div class="visualizer-container">
            <canvas id="visualizer"></canvas>
            <div class="empty-state" data-i18n="waiting_recording">Waiting for a recording to start...</div>
          </div>

          <div class="recording-indicator" id="recIndicator">
            <div class="pulsar"></div>
            <span data-i18n="recording_status">Recording...</span>
          </div>
        </div>

        <div class="controls-row">
          <button id="recordBtn" class="primary-btn">
            <i class="fas fa-circle"></i>
            <span data-i18n="btn_start_recording">Start Recording</span>
          </button>
        </div>
      </div>

      <div class="recordings-container">
        <div class="section-header">
          <h2 data-i18n="library_title">Recordings</h2>
          <div class="sort-control">
            <span data-i18n="sort_by">Sort by:</span>
            <select id="sortSelect">
              <option value="newest" data-i18n="opt_newest">Newest</option>
              <option value="oldest" data-i18n="opt_oldest">Oldest</option>
            </select>
          </div>
        </div>

        <div id="recordingsGrid" class="recordings-grid">
          <p class="empty-recordings-state" data-i18n="empty_recordings">
            No recordings yet. Start a new one above!
          </p>
        </div>
      </div>
    </main>

    <footer class="app-footer">
      <p id="statusMessage" class="status-message" data-i18n="status_ready">Ready</p>
      <div class="storage-info" id="storageInfo">
        <i class="fas fa-database storage-icon"></i>
        <span id="storageStatus">0 MB of 74 MB</span>
        <div id="storageTooltip" class="tooltip" data-i18n="storage_limit_label">Storage Limit: 74 MB</div>
      </div>
    </footer>
  </div>

  <div id="settingsModal" class="modal">
    <div class="modal-content glass-card">
      <div class="modal-header">
        <h3 data-i18n="settings_title">Settings</h3>
        <button class="close-btn" id="closeSettingsBtn" aria-label="Close Settings">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="modal-body">
        <div class="settings-option">
          <label for="langSelect"><i class="fas fa-language"></i> Language / Langue</label>
          <div class="select-wrapper">
            <select id="langSelect" class="settings-select">
              <option value="en">English</option>
              <option value="fr">Français</option>
            </select>
            <i class="fas fa-chevron-down select-arrow"></i>
          </div>
        </div>

        <div class="settings-option">
          <label for="tempSetting1"><i class="fas fa-sliders-h"></i> Temp Setting 1</label>
          <label class="switch">
            <input type="checkbox" id="tempSetting1">
            <span class="slider round"></span>
          </label>
        </div>

        <div class="settings-option">
          <label for="tempSetting2"><i class="fas fa-bolt"></i> Temp Setting 2</label>
          <label class="switch">
            <input type="checkbox" id="tempSetting2">
            <span class="slider round"></span>
          </label>
        </div>
      </div>
    </div>
  </div>

  <template id="recordingTemplate">
    <div class="recording-card" data-id="">
      <div class="card-header">
        <span class="card-title">Recording</span>
        <span class="card-time">0:00</span>
      </div>

      <div class="waveform-container">
        <canvas></canvas>
        <div class="playback-bar"></div>
      </div>

      <div class="card-controls">
        <button class="icon-btn play-btn" title="Play/Pause">
          <i class="fas fa-play"></i>
          <span>Play</span>
        </button>

        <button class="icon-btn reverse-btn" title="Reverse">
          <i class="fas fa-exchange-alt"></i>
        </button>

        <div class="speed-controls">
          <button class="icon-btn speed-btn speedDown" title="Slower">
            <i class="fas fa-angle-left"></i>
          </button>
          <span class="speed-display">1.00x</span>
          <button class="icon-btn speed-btn speedUp" title="Faster">
            <i class="fas fa-angle-right"></i>
          </button>
        </div>

        <button class="icon-btn delete-btn" title="Delete">
          <i class="fas fa-trash"></i>
        </button>
      </div>
    </div>
  </template>
</body>

</html>
