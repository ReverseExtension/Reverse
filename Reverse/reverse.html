<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>REVERSE</title>
  <link rel="stylesheet" href="reverse.css" />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    referrerpolicy="no-referrer"
  />
</head>

<body>
  <div class="app-container">
    <header class="app-header">
      <div class="logo-container">
        <i class="fas fa-undo-alt logo-icon"></i>
        <h1>REVERSE</h1>
      </div>
      <div class="header-controls">
        <button id="themeToggle" class="icon-btn" title="Toggle Theme">
          <i class="fas fa-sun"></i>
        </button>
        <button id="settingsBtn" class="icon-btn" title="Settings">
          <i class="fas fa-cog"></i>
        </button>
      </div>
    </header>

    <main class="app-main">
      <div class="recorder-panel">
        <div class="visualizer-container">
          <canvas id="visualizer"></canvas>
          <div class="empty-state">Waiting for a recording to start...</div>
        </div>

        <div class="recording-indicator" id="recIndicator">
          <div class="pulsar"></div>
          <span>Recording...</span>
        </div>

        <div class="controls-row">
          <button id="recordBtn" class="primary-btn">
            <i class="fas fa-circle"></i>
            <span>Start Recording</span>
          </button>
        </div>
      </div>

      <div class="recordings-container">
        <div class="section-header">
          <h2>Recordings</h2>
          <div class="sort-control">
            <span>Sort by:</span>
            <select id="sortSelect">
              <option value="newest">Newest</option>
              <option value="oldest">Oldest</option>
            </select>
          </div>
        </div>

        <div id="recordingsGrid" class="recordings-grid">
          <p class="empty-recordings-state">
            No recordings yet. Start a new one above!
          </p>
        </div>
      </div>
    </main>

    <footer class="app-footer">
      <p id="statusMessage" class="status-message">Ready</p>
      <div class="storage-info" id="storageInfo">
        <i class="fas fa-database storage-icon"></i>
        <span id="storageStatus">0 MB of 74 MB</span>
        <div id="storageTooltip" class="tooltip">Storage Limit: 74 MB</div>
      </div>
    </footer>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Settings</h3>
        <button class="close-btn" aria-label="Close Settings">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="modal-body">
        <div class="settings-option">
          <label for="exportOriginalAndReversed">Export Original and Reversed</label>
          <input type="checkbox" id="exportOriginalAndReversed" />
        </div>
        <div class="settings-option">
          <label for="exportWithInfoFile">Export with Info File</label>
          <input type="checkbox" id="exportWithInfoFile" />
        </div>
        <div class="settings-option">
          <label for="enableHighQuality">High Quality (WAV)</label>
          <input type="checkbox" id="enableHighQuality" />
        </div>
      </div>
      <div class="modal-footer">
        <button id="clearRecordingsBtn" class="danger-btn">
          <i class="fas fa-trash"></i>
          Clear All Recordings
        </button>
        <button id="exportAllRecordingsBtn" class="secondary-btn">
          <i class="fas fa-file-export"></i>
          Export All
        </button>
      </div>
    </div>
  </div>

  <!-- Storage Warning Modal -->
  <div id="warningModal" class="modal warning">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Storage Warning</h3>
        <button class="close-btn" aria-label="Close Warning">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="modal-body">
        <p id="warningMessage"></p>
        <ul class="warning-tips">
          <li>Delete old recordings to free up space.</li>
          <li>Export recordings to save them externally.</li>
        </ul>
      </div>
      <div class="modal-footer">
        <button class="secondary-btn" id="warningOkBtn">OK</button>
      </div>
    </div>
  </div>

  <!-- Generic Modal (Info / Success / Error / Confirm) -->
  <div id="genericModal" class="modal info">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="genericModalTitle">Information</h3>
        <button class="close-btn" aria-label="Close Modal">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="modal-body" id="genericModalBody"></div>
      <div class="modal-footer" id="genericModalFooter"></div>
    </div>
  </div>

  <!-- Recording Card Template -->
  <template id="recordingTemplate">
    <div class="recording-card" data-id="">
      <div class="card-header">
        <span class="card-title">Recording</span>
        <span class="card-time">0:00</span>
      </div>

      <div class="waveform-container">
        <canvas></canvas>
        <div class="playback-bar"></div>
      </div>

      <div class="card-controls">
        <button class="icon-btn play-btn" title="Play/Pause">
          <i class="fas fa-play"></i>
          <span>Play</span>
        </button>

        <button class="icon-btn reverse-btn" title="Reverse">
          <i class="fas fa-exchange-alt"></i>
        </button>

        <div class="speed-controls">
          <button class="icon-btn speed-btn speedDown" title="Slower">
            <i class="fas fa-angle-left"></i>
          </button>
          <span class="speed-display">1.00x</span>
          <button class="icon-btn speed-btn speedUp" title="Faster">
            <i class="fas fa-angle-right"></i>
          </button>
        </div>

        <button class="icon-btn delete-btn" title="Delete">
          <i class="fas fa-trash"></i>
        </button>

        <button class="icon-btn export-btn" title="Export">
          <i class="fas fa-download"></i>
        </button>
      </div>
    </div>
  </template>

  <script src="reverse.js"></script>
</body>

</html>
