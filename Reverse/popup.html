<!DOCTYPE html>
<html lang="en" class="theme-dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>REVERSE</title>
  <link rel="stylesheet" href="popup.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>

<body>
  <div class="app-container">
    <header class="app-header">
      <div class="logo-container">
        <i class="fas fa-wave-square logo-icon"></i>
        <h1>REVERSE</h1>
      </div>
      <div class="header-controls">
        <button id="settingsBtn" class="icon-btn" aria-label="Open settings">
          <i class="fas fa-cog"></i>
        </button>
        <button id="themeToggle" class="icon-btn" aria-label="Toggle theme">
          <i class="fas fa-moon"></i>
        </button>
      </div>
    </header>

    <main class="app-main">
      <div class="recorder-panel">
        <div class="visualizer-container">
          <canvas id="visualizer"></canvas>
          <div class="recording-indicator">
            <div class="pulsar"></div>
            <span>RECORDING</span>
          </div>
        </div>

        <div class="controls-row">
          <button id="recordBtn" class="primary-btn record-btn">
            <i class="fas fa-circle"></i>
            <span>Start Recording</span>
          </button>
        </div>
      </div>

      <div class="recordings-container">
        <div class="section-header">
          <h2>Your Recordings</h2>
          <div class="sort-control">
            <span>Sort:</span>
            <select id="sortSelect">
              <option value="newest">Newest First</option>
              <option value="oldest">Oldest First</option>
            </select>
          </div>
        </div>

        <div id="recordingsGrid" class="recordings-grid">
        </div>
      </div>
    </main>

    <footer class="app-footer">
      <div class="status-bar">
        <span id="statusMessage">Loading...</span>
        <span id="storageStatus"><i class="fas fa-database"></i></span>
      </div>
    </footer>
  </div>

  <template id="recordingTemplate">
    <div class="recording-card">
      <div class="card-header">
        <div class="card-title">New Recording</div>
        <div class="card-time">00:00</div>
      </div>

      <div class="waveform-container">
        <canvas></canvas>
      </div>

      <div class="card-controls">
        <button class="control-btn play-btn">
          <i class="fas fa-play"></i>
          <span>Play</span>
        </button>
        <button class="control-btn reverse-btn">
          <i class="fas fa-sync-alt"></i>
          <span>Reverse</span>
        </button>
        <button class="control-btn delete-btn">
          <i class="fas fa-trash"></i>
          <span>Delete</span>
        </button>
        <button class="control-btn export-btn">
          <i class="fas fa-download"></i>
          <span>Export</span>
        </button>
      </div>

      <div class="speed-control track-speed-control">
        <button class="icon-btn speedDown" aria-label="Decrease speed">
          <i class="fas fa-chevron-left"></i>
        </button>
        <div class="speed-display">1.0x</div>
        <button class="icon-btn speedUp" aria-label="Increase speed">
          <i class="fas fa-chevron-right"></i>
        </button>
      </div>
    </div>
  </template>

  <script type="module" src="popup.js" defer></script>
</body>

</html>
